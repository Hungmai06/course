<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.w3.org/1999/xhtml">
<head>
    <meta charset="UTF-8">
    <title>Gửi mật khẩu mới</title>
    <style>
        body {
          font-family: Arial, sans-serif;
          background-color: #f2f2f2;
          padding: 0;
          margin: 0;
        }

        .email-container {
          max-width: 600px;
          margin: 40px auto;
          background-color: #ffffff;
          border-radius: 8px;
          overflow: hidden;
          box-shadow: 0 4px 8px rgba(0,0,0,0.1);
        }

        .header {
          background-color: #4a90e2;
          color: white;
          padding: 20px;
          text-align: center;
        }

        .content {
          padding: 30px;
        }

        .otp-code {
          font-size: 32px;
          font-weight: bold;
          color: #4a90e2;
          letter-spacing: 6px;
          text-align: center;
          margin: 20px 0;
        }

        .footer {
          font-size: 12px;
          color: #888888;
          text-align: center;
          padding: 20px;
          background-color: #f9f9f9;
        }

        .info {
          font-size: 14px;
          margin-bottom: 10px;
        }

        .bold {
          font-weight: bold;
        }
    </style>
</head>
<body>
<div class="email-container">
    <div class="header">
        <h2>📧 Xác minh tài khoản</h2>
    </div>
    <div class="content">
        <p class="info">Xin chào,</p>
        <p class="info">Bạn (hoặc ai đó) đã yêu cầu cức năng quên mật khẩu.</p>
        <p class="info">Mật khẩu mới của bạn là:</p>
        <div class="otp-code" th:text="${otp}">123454</div>
        <p class="info">Mã này có hiệu lực trong 5 phút.</p>
        <p class="info">Nếu bạn không yêu cầu, hãy bỏ qua email này.</p>
    </div>
    <div class="footer">
        Đây là email tự động. Vui lòng không trả lời.<br/>
        © 2025 Công ty của bạn. Mọi quyền được bảo lưu.
    </div>
</div>
</body>
</html>
