# ================================================================
# Cấu hình Nginx Reverse Proxy cho Main Domain & Subdomain 48ngay
# Đặt file này tại: /etc/nginx/sites-available/default trên Server
# ================================================================

# 1. Main Domain (Frontend FE khóa học chính)
server {
    listen 80;
    server_name khoahocdrivemh.pro.vn www.khoahocdrivemh.pro.vn;

    location / {
        proxy_pass http://127.0.0.1:5173;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# 2. Subdomain (Frontend 48ngay / DolphinLearn)
server {
    listen 80;
    server_name english.khoahocdrivemh.pro.vn;

    location / {
        proxy_pass http://127.0.0.1:5174;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
